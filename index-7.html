<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meat House — интернет-дүкен</title>
<style>
:root{--red:#9d2027;--dark:#242424;--cream:#faf7f2}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:#222}header{background:var(--dark);color:#fff;padding:18px 14px;text-align:center}header h1{margin:0;font-size:28px;letter-spacing:1px}header p{margin:6px 0 0;color:#eee}.wrap{max-width:1000px;margin:auto;padding:16px}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--red);color:white;font-weight:bold;cursor:pointer}.btn.secondary{background:#333}.btn.light{background:#eee;color:#222}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:16px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 9px #00000010}.card img{width:100%;height:130px;object-fit:cover;border-radius:8px;background:#eee}.card h3{font-size:17px;margin:10px 0 6px}.price{font-weight:bold;color:var(--red);margin:8px 0}.card .btn{width:100%}section{background:white;border-radius:12px;padding:16px;margin-top:18px;box-shadow:0 2px 9px #0000000c}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0 10px;font-size:16px}label{font-size:14px;font-weight:bold}.cart-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.cart-row span{flex:1}.cart-row input{width:65px;margin:0}.small{font-size:13px;color:#666}.hidden{display:none}.admin-product{border-bottom:1px solid #eee;padding:10px 0}.admin-product button{margin:3px}.footer{text-align:center;color:#777;padding:24px;font-size:13px}
</style></head>
<body>
<header><h1>MEAT HOUSE</h1><p>Ет өнімдері • Үйіңізге жеткізу</p></header>
<div class="wrap">
<div class="top"><h2>Өнімдер</h2><button class="btn secondary" onclick="document.getElementById('cartSection').scrollIntoView({behavior:'smooth'})">🛒 Себет (<span id="cartCount">0</span>)</button></div>
<div id="products" class="products"></div>
<section id="cartSection"><h2>🛒 Себет</h2><div id="cartItems">Себет әзірге бос.</div><h3>Жалпы: <span id="total">0</span> ₸</h3><label>Аты-жөніңіз</label><input id="customerName" placeholder="Атыңыз"><label>Телефон нөміріңіз</label><input id="customerPhone" type="tel" placeholder="8707..."/><label>Жеткізу мекенжайы</label><textarea id="customerAddress" placeholder="Көше, үй, пәтер"></textarea><button class="btn" onclick="checkout()">WhatsApp арқылы тапсырыс беру</button><p class="small">Тапсырыс WhatsApp арқылы жіберіледі.</p></section>
<section><h2>🔐 Әкімші бөлімі</h2><div id="adminLogin"><label>Құпиясөз</label><input id="adminPass" type="password" placeholder="Құпиясөз"><button class="btn secondary" onclick="loginAdmin()">Кіру</button></div><div id="adminPanel" class="hidden"><h3>Жаңа тауар қосу</h3><label>Тауар атауы</label><input id="newName" placeholder="Мысалы: Сиыр еті"><label>Бағасы (₸/кг)</label><input id="newPrice" type="number" min="1" placeholder="4500"><label>Сурет</label><input id="newImage" type="file" accept="image/*"><button class="btn" onclick="addProduct()">Тауар қосу</button><h3>Тауарларды басқару</h3><div id="adminProducts"></div><button class="btn light" onclick="logoutAdmin()">Шығу</button></div></section>
</div><div class="footer">Meat House · Тапсырыс WhatsApp арқылы қабылданады</div>
<script>
const WA_NUMBER='77072161570';const ADMIN_PASSWORD='meat2287';
const starter=[{id:1,name:'Сиыр еті',price:4500,image:''},{id:2,name:'Қой еті',price:4200,image:''},{id:3,name:'Сорпаға арналған сүйек',price:500,image:''},{id:4,name:'Фарш',price:3500,image:''}];
let products=load('mh_products',starter),cart=load('mh_cart',{}),orders=load('mh_orders',[]),admin=false;
function load(k,def){try{let v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(){try{localStorage.setItem('mh_products',JSON.stringify(products));localStorage.setItem('mh_cart',JSON.stringify(cart));localStorage.setItem('mh_orders',JSON.stringify(orders));return true}catch(e){alert('Сақтау мүмкін болмады. Сурет тым үлкен болуы мүмкін. Кішірек сурет таңдаңыз немесе браузерде сайт деректеріне рұқсат беріңіз.');return false}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderProducts(){document.getElementById('products').innerHTML=products.map(p=>`<article class="card">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:'<div style="height:130px;border-radius:8px;background:#f1e8df;display:grid;place-items:center;font-size:46px">🥩</div>'}<h3>${esc(p.name)}</h3><div class="price">${Number(p.price).toLocaleString('ru-RU')} ₸ / кг</div><button class="btn" onclick="addToCart(${p.id})">Себетке қосу</button></article>`).join('')||'<p>Тауар жоқ.</p>';renderAdmin()}
function addToCart(id){cart[id]=(Number(cart[id])||0)+1;save();renderCart()}
function changeQty(id,qty){if(qty<1)delete cart[id];else cart[id]=qty;save();renderCart()}
function renderCart(){let items=products.filter(p=>cart[p.id]);let count=Object.values(cart).reduce((a,b)=>a+Number(b),0);document.getElementById('cartCount').textContent=count;document.getElementById('cartItems').innerHTML=items.length?items.map(p=>`<div class="cart-row"><span>${esc(p.name)}<br><b>${Number(p.price).toLocaleString('ru-RU')} ₸</b></span><input aria-label="Саны" type="number" min="0.1" step="0.5" value="${cart[p.id]}" onchange="changeQty(${p.id},Number(this.value))"><button class="btn light" onclick="changeQty(${p.id},0)">✕</button></div>`).join(''):'Себет әзірге бос.';let total=items.reduce((s,p)=>s+p.price*cart[p.id],0);document.getElementById('total').textContent=total.toLocaleString('ru-RU');}
function checkout(){let items=products.filter(p=>cart[p.id]);if(!items.length){alert('Алдымен себетке тауар қосыңыз.');return}let name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),address=document.getElementById('customerAddress').value.trim();if(!name||!phone||!address){alert('Аты-жөніңізді, телефонды және мекенжайды толтырыңыз.');return}let total=items.reduce((s,p)=>s+p.price*cart[p.id],0);let message='Сәлеметсіз бе! Meat House тапсырысы:%0A'+items.map(p=>'- '+p.name+' — '+cart[p.id]+' кг × '+p.price+' ₸ = '+(p.price*cart[p.id])+' ₸').join('%0A')+'%0AЖалпы: '+total+' ₸%0AАты: '+name+'%0AТелефон: '+phone+'%0AМекенжай: '+address;orders.push({name,phone,address,items:items.map(p=>({name:p.name,qty:cart[p.id],price:p.price})),total,date:new Date().toLocaleString()});save();window.open('https://wa.me/'+WA_NUMBER+'?text='+message,'_blank');}
function loginAdmin(){if(document.getElementById('adminPass').value===ADMIN_PASSWORD){admin=true;document.getElementById('adminLogin').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');renderAdmin()}else alert('Құпиясөз дұрыс емес.')}
function logoutAdmin(){admin=false;document.getElementById('adminLogin').classList.remove('hidden');document.getElementById('adminPanel').classList.add('hidden');document.getElementById('adminPass').value=''}
function renderAdmin(){if(!admin)return;document.getElementById('adminProducts').innerHTML=products.map(p=>`<div class="admin-product"><b>${esc(p.name)}</b><br><label>Бағасы (₸)</label><input id="price-${p.id}" type="number" min="1" value="${p.price}"><button class="btn secondary" onclick="editPrice(${p.id})">Бағаны сақтау</button><br><label>Тауар суретін өзгерту</label><input id="image-${p.id}" type="file" accept="image/*"><button class="btn secondary" onclick="updateProductImage(${p.id})">Суретті сақтау</button><button class="btn light" onclick="deleteProduct(${p.id})">Өшіру</button></div>`).join('')+`<h3>Сақталған тапсырыстар: ${orders.length}</h3>`+(orders.length?orders.slice().reverse().map(o=>`<div class="admin-product"><b>${esc(o.name)} · ${o.total.toLocaleString('ru-RU')} ₸</b><br>${esc(o.phone)} · ${esc(o.address)}<br><span class="small">${esc(o.date)}</span><br>${o.items.map(i=>esc(i.name)+' — '+i.qty+' кг').join(', ')}</div>`).join(''):'<p class="small">Тапсырыс әлі жоқ.</p>')}
function editPrice(id){let p=products.find(x=>x.id===id),v=Number(document.getElementById('price-'+id).value);if(!p||!v||v<1){alert('Бағаны дұрыс енгізіңіз.');return}p.price=v;save();renderProducts();renderCart();alert('Баға сақталды.')}
function updateProductImage(id){let file=document.getElementById('image-'+id).files[0];if(!file){alert('Алдымен суретті таңдаңыз.');return}if(!file.type.startsWith('image/')){alert('Сурет файлын таңдаңыз.');return}let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),max=700,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let p=products.find(x=>x.id===id);if(!p)return;p.image=c.toDataURL('image/jpeg',.72);if(save()){renderProducts();renderCart();alert('Сурет сақталды. Сайтты сол браузерден ашыңыз.')}};img.onerror=()=>alert('Суретті оқу мүмкін болмады. Басқа сурет таңдаңыз.');img.src=e.target.result};r.readAsDataURL(file)}
function deleteProduct(id){if(!confirm('Осы тауарды өшіресіз бе?'))return;products=products.filter(p=>p.id!==id);delete cart[id];save();renderProducts();renderCart()}
function addProduct(){let name=document.getElementById('newName').value.trim(),price=Number(document.getElementById('newPrice').value),file=document.getElementById('newImage').files[0];if(!name||!price||price<1){alert('Тауар атауы мен бағасын толтырыңыз.');return}let add=image=>{products.push({id:Date.now(),name,price,image:image||''});save();renderProducts();document.getElementById('newName').value='';document.getElementById('newPrice').value='';document.getElementById('newImage').value='';alert('Тауар қосылды.')};if(file){let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),max=700,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);add(c.toDataURL('image/jpeg',.78))};img.onerror=()=>add(e.target.result);img.src=e.target.result};r.readAsDataURL(file)}else add('')}
renderProducts();renderCart();
</script></body></html>
